{{define "content"}}
<h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100 mb-6">Audit log</h1>

{{if not .Data}}
  <p class="text-slate-500 dark:text-slate-400 text-sm">No administrative action recorded yet.</p>
{{else}}
<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
  <div class="overflow-x-auto">
  <table class="w-full text-sm whitespace-nowrap">
    <thead class="text-left text-xs text-slate-400 dark:text-slate-500 uppercase tracking-wide">
      <tr class="border-b border-slate-100 dark:border-slate-800">
        <th class="px-5 py-2 font-medium">When</th>
        <th class="px-5 py-2 font-medium">Actor</th>
        <th class="px-5 py-2 font-medium">Action</th>
        <th class="px-5 py-2 font-medium">Target</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
      {{range .Data}}
      <tr class="hover:bg-slate-50/60 dark:hover:bg-slate-800/40">
        <td class="px-5 py-2.5 text-slate-600 dark:text-slate-300 cursor-help" title="{{exact .TS}}">{{ago .TS}}</td>
        <td class="px-5 py-2.5 text-slate-800 dark:text-slate-100">{{.Actor}}</td>
        <td class="px-5 py-2.5"><span class="font-mono text-xs rounded bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-1.5 py-0.5">{{.Action}}</span></td>
        <td class="px-5 py-2.5 text-slate-600 dark:text-slate-300">{{if .Target}}{{.Target}}{{else}}—{{end}}</td>
      </tr>
      {{end}}
    </tbody>
  </table>
  </div>
</div>
{{end}}
{{end}}
