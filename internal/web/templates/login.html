{{define "content"}}
<div class="max-w-sm mx-auto mt-12 sm:mt-20">
  <div class="text-center mb-8">
    <img src="/static/logo.svg?v={{.AssetV}}" alt="" class="mx-auto h-20 w-20 mb-4 drop-shadow">
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">wgroster</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Self-service WireGuard configs and live fleet status.</p>
  </div>
  <form method="post" action="/login" class="bg-white dark:bg-slate-900 rounded-2xl shadow-lg shadow-slate-200/60 dark:shadow-black/30 border border-slate-200 dark:border-slate-800 p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Username</label>
      <input name="uid" autofocus autocomplete="username" required
             class="w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:placeholder-slate-500 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
      <input name="password" type="password" autocomplete="current-password" required
             class="w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:placeholder-slate-500 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>
    <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg px-4 py-2">Sign in</button>
  </form>
</div>
{{end}}
