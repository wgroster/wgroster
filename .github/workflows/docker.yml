name: Docker image

# Build and publish the multi-arch container image to the GitHub Container
# Registry under the dedicated `wgroster` org (ghcr.io/wgroster/wgroster).
#
# Because that org is NOT this repository's owner, the automatic GITHUB_TOKEN
# cannot push to it. Configure two repository secrets:
#   - GHCR_USERNAME: a GitHub account that is a member of the `wgroster` org
#   - GHCR_TOKEN:    a Personal Access Token (classic) owned by that account
#                    with the `write:packages` scope.
# Also link the package to this repo (in the org's package settings) so future
# pushes can use the repo's permissions if you later switch to GITHUB_TOKEN.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/wgroster/wgroster

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
